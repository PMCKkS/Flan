help:
  player:
    - "&e/flan tp <claim name> &7- Return to your claim, including across servers"
    - '&e/flan trusted &7Manage trusted players and edit individual permissions'
    - '&e/flan mode 2d|3d &7Switch claim mode; 3d uses both corner heights'
    - "&6/flan tool &7Get the tool; right click corner one, left click corner two"
    - "&e/flan create [name] &7Create; subclaim [name] creates a subclaim"
    - "&e/flan info | list [page] | blocks | show | menu"
